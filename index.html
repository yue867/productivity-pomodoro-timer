<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活效率工具箱</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <div class="logo">
                    <img src="https://api.iconify.design/noto:rocket.svg?color=%234A90D9" alt="logo" class="logo-icon">
                    <h1>生活效率工具箱</h1>
                </div>
                <nav class="tab-nav">
                    <button class="tab-btn active" data-tab="pomodoro">
                        <span class="tab-icon">🍅</span>
                        <span class="tab-label">番茄钟</span>
                    </button>
                    <button class="tab-btn" data-tab="todo">
                        <span class="tab-icon">✓</span>
                        <span class="tab-label">待办事项</span>
                    </button>
                </nav>
            </div>
        </header>

        <main class="main-content">
            <div class="tab-content active" id="pomodoro-content">
                <div class="tool-container">
                    <section class="task-input-section">
                        <input type="text" id="taskName" class="task-input" placeholder="输入当前任务名称..." maxlength="50">
                    </section>

                    <section class="timer-section">
                        <div class="progress-ring-container">
                            <svg class="progress-ring" viewBox="0 0 200 200">
                                <circle class="progress-ring-bg" cx="100" cy="100" r="90" />
                                <circle class="progress-ring-fill" id="progressRing" cx="100" cy="100" r="90" />
                            </svg>
                            <div class="timer-content">
                                <div class="timer-display" id="timerDisplay">25:00</div>
                                <div class="timer-status" id="timerStatus">准备开始</div>
                            </div>
                        </div>
                    </section>

                    <section class="controls-section">
                        <button class="btn btn-primary" id="startBtn">开始</button>
                        <button class="btn btn-secondary" id="pauseBtn" disabled>暂停</button>
                        <button class="btn btn-secondary" id="resetBtn">重置</button>
                    </section>

                    <section class="stats-section">
                        <div class="stats-card">
                            <span class="stats-label">今日完成</span>
                            <div class="tomato-display" id="tomatoDisplay">
                                <span class="tomato">🍅</span>
                                <span class="tomato">🍅</span>
                                <span class="tomato">🍅</span>
                            </div>
                            <span class="stats-count">(<span id="tomatoCount">0</span>个)</span>
                        </div>
                    </section>
                </div>
            </div>

            <div class="tab-content" id="todo-content">
                <div class="tool-container">
                    <section class="todo-input-section">
                        <div class="todo-input-wrapper">
                            <input type="text" id="todoInput" class="todo-input" placeholder="添加新的待办事项..." maxlength="100">
                            <button class="btn btn-primary btn-add" id="addTodoBtn">添加</button>
                        </div>
                    </section>

                    <section class="todo-list-section">
                        <div class="todo-tabs">
                            <button class="todo-tab-btn active" data-filter="all">全部</button>
                            <button class="todo-tab-btn" data-filter="active">待完成</button>
                            <button class="todo-tab-btn" data-filter="completed">已完成</button>
                        </div>
                        <div class="todo-list" id="todoList">
                        </div>
                        <div class="todo-empty" id="todoEmpty">
                            <img src="https://api.iconify.design/noto:thought-balloon.svg?color=%2395A5A6" alt="empty" class="empty-icon">
                            <p>暂无待办事项</p>
                            <p class="empty-hint">添加一个新的待办开始吧！</p>
                        </div>
                    </section>

                    <section class="todo-stats">
                        <span class="todo-count">共 <span id="todoTotalCount">0</span> 项</span>
                        <span class="todo-count completed">已完成 <span id="todoCompletedCount">0</span> 项</span>
                    </section>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <div class="settings-section">
                <button class="settings-toggle" id="settingsToggle">
                    <span class="settings-icon">⚙</span>
                    <span>设置</span>
                </button>
                <div class="settings-panel" id="settingsPanel">
                    <div class="settings-group">
                        <h3 class="settings-group-title">🍅 番茄钟设置</h3>
                        <div class="setting-item">
                            <label for="focusDuration">专注时长</label>
                            <div class="setting-input-group">
                                <input type="number" id="focusDuration" value="25" min="1" max="60">
                                <span class="setting-unit">分钟</span>
                            </div>
                        </div>
                        <div class="setting-item">
                            <label for="shortBreakDuration">短休息时长</label>
                            <div class="setting-input-group">
                                <input type="number" id="shortBreakDuration" value="5" min="1" max="30">
                                <span class="setting-unit">分钟</span>
                            </div>
                        </div>
                        <div class="setting-item">
                            <label for="longBreakDuration">长休息时长</label>
                            <div class="setting-input-group">
                                <input type="number" id="longBreakDuration" value="15" min="1" max="60">
                                <span class="setting-unit">分钟</span>
                            </div>
                        </div>
                        <div class="setting-item">
                            <label for="tomatoesUntilLongBreak">长休息前番茄数</label>
                            <div class="setting-input-group">
                                <input type="number" id="tomatoesUntilLongBreak" value="4" min="2" max="10">
                                <span class="setting-unit">个</span>
                            </div>
                        </div>
                        <div class="setting-item">
                            <label for="soundEnabled">提示音</label>
                            <div class="toggle-switch">
                                <input type="checkbox" id="soundEnabled" checked>
                                <span class="toggle-slider"></span>
                            </div>
                        </div>
                    </div>
                    <div class="settings-group">
                        <h3 class="settings-group-title">📤 数据导出</h3>
                        <div class="export-buttons">
                            <button class="btn btn-export" id="exportJsonBtn">
                                <span class="btn-icon">{}</span>
                                导出 JSON
                            </button>
                            <button class="btn btn-export" id="exportCsvBtn">
                                <span class="btn-icon">⪫</span>
                                导出 CSV
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <div class="toast" id="toast">
        <span class="toast-message" id="toastMessage"></span>
    </div>

    <script src="script.js"></script>
</body>
</html>
